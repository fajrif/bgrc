# Copy over /etc/nginx/nginx.conf (no sites-available), then: sudo nginx -t && sudo systemctl reload nginx
# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/
#   *** YOU NEED TO DISABLE SElinux ***
#
# Phase 1 (pre-production): reached by IP, self-signed certificate (deploy/make-ip-cert.sh).
# Phase 2 (go-live): uncomment the balibeachcountryclub.com blocks at the bottom.

user deployer;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information. Leave /etc/nginx/conf.d empty of old Lightstein files.
    include /etc/nginx/conf.d/*.conf;

    upstream unicorn_bgrc {
      server unix:/home/deployer/preproduction/bgrc/tmp/sockets/unicorn.bgrc.sock fail_timeout=0;
    }

    # Settings shared by every server block below.
    client_body_temp_path /home/deployer/preproduction/bgrc/tmp 1 2;
    client_max_body_size 100M;
    proxy_max_temp_file_size 3072m;
    client_header_timeout 3m;
    client_body_timeout 3m;
    send_timeout 3m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------------------------------------------------------------------
    # Phase 1: plain HTTP. Redirects to HTTPS, except gateway webhooks, which
    # go straight to the app (a redirected POST is lost; Rails exempts
    # /webhooks/ from force_ssl for the same reason).
    # ---------------------------------------------------------------------
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  128.199.83.171 _;
        root         /home/deployer/preproduction/bgrc/public;

        location /webhooks/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://unicorn_bgrc;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------
    # Phase 1: HTTPS on the server IP with a self-signed certificate.
    # ---------------------------------------------------------------------
    server {
        listen       443 ssl default_server;
        listen       [::]:443 ssl default_server;
        server_name  128.199.83.171 _;
        root         /home/deployer/preproduction/bgrc/public;

        ssl_certificate     /home/deployer/.ssl/bgrc-ip.crt;
        ssl_certificate_key /home/deployer/.ssl/bgrc-ip.key;

        # Digested assets never change, so they can be cached for a year.
        location ^~ /assets/ {
            gzip_static on;
            expires max;
            add_header Cache-Control public;
        }

        try_files $uri/index.html $uri @unicorn_bgrc;

        location @unicorn_bgrc {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_redirect off;
            proxy_pass http://unicorn_bgrc;
        }

    }

    # ---------------------------------------------------------------------
    # Phase 2 (go-live): uncomment, then remove "default_server" from the two
    # IP blocks above, or delete them. Certificates go in /home/deployer/.ssl/.
    # ---------------------------------------------------------------------
